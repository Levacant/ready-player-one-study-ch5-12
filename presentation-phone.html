<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Presentation Practice</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:14px 14px 70px}h1{font-size:25px;margin:5px 0}.sub,.muted{color:#aeb8d5}.tabs{display:flex;gap:7px;overflow:auto;padding:10px 0 5px}.tab,.btn,.choice{border:1px solid #34405f;background:#151d35;color:#fff;border-radius:14px;min-height:46px;padding:11px 13px;font-weight:800}.tab{white-space:nowrap}.tab.on{background:#8bdcff;color:#07111e}.card{background:#151d35;border:1px solid #2e3958;border-radius:19px;padding:16px;margin:11px 0}.tag{font-size:11px;color:#8bdcff;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.title{font-size:22px;font-weight:900;margin:6px 0 10px}.prompt{font-size:19px;font-weight:800;line-height:1.4}.box{background:#0e162b;border-radius:13px;padding:12px;margin-top:10px;line-height:1.5}.say{border-left:4px solid #8bdcff}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.btn{width:100%}.hidden{display:none!important}.choice{width:100%;display:block;text-align:left;margin:8px 0;font-size:15px}.good{background:#12351f;border-color:#47d678}.bad{background:#3a171d;border-color:#ff6b7b}.score{font-size:38px;font-weight:950}.anchor{text-align:center;font-size:22px;font-weight:950;line-height:1.6}.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:950}.tiny{font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#26314d;margin:3px}.bar{height:8px;background:#29334d;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:#8bdcff}textarea{width:100%;min-height:120px;background:#0e162b;color:#fff;border:1px solid #34405f;border-radius:13px;padding:12px;font-size:16px}@media(max-width:390px){.app{padding:10px 10px 60px}.title{font-size:20px}}
</style></head><body><div class="app"><h1>Imagery + Juxtaposition</h1><div class="sub">Phone rehearsal based on your current slides</div><div class="tabs" id="tabs"></div><main id="main"></main></div><script>
const slides=[
["Imagery & Juxtaposition","Introduce the two topics without explaining everything yet.","Imagery and juxtaposition are the two techniques I'm going to explain. I'll show what each one means and examples of how they're used.","Just introduce the presentation. Save the detailed definitions for the next slides."],
["What is Imagery?","Explain the definition and connect it to the five senses.","Imagery is descriptive language that helps readers imagine what they see, hear, smell, taste, or feel. Those are the five senses: sight, sound, smell, taste, and touch.","A strong explanation says what imagery is AND what the sensory details do for the reader."],
["Imagery Example – Ratatouille","Explain why your Ratatouille image works as imagery.","Ratatouille is a good imagery example because its food scenes use vivid colors and textures that make us imagine what the food would be like.","Point to evidence in the example instead of only saying 'Ratatouille uses imagery.'"],
["How Ratatouille Uses Imagery","Connect Ratatouille to each sense shown on your slide.","We see colorful food, hear sizzling and cooking, imagine the aroma and flavor, and imagine the texture and warmth. The movie makes the food feel like a sensory experience.","Your slide shows all five senses, so walk through them quickly and connect them back to imagery."],
["Why Writers Use Imagery","Explain the PURPOSE of imagery.","Writers use imagery to create mood, make scenes vivid, build emotion, help readers imagine what is happening, and make writing more memorable.","This answers why someone would use imagery, not just what imagery means."],
["Quick Class Example","Explain which senses the soup sentence appeals to and prove it.","The steam under my nose suggests smell, the salty broth appeals to taste, and the warmth appeals to touch. Those details help us imagine experiencing the soup.","Use the actual words from the example as evidence: steam, salty, and warmed."],
["What is Juxtaposition?","Define it and explain one of the contrast pairs on your slide.","Juxtaposition is putting two things close together so their differences or similarities stand out. For example, putting light next to dark makes the contrast easier to notice.","The key isn't just that two things are different. Presenting them together makes the difference stand out."],
["Juxtaposition Example – Cinderella","Explain what is being contrasted in your two images.","Cinderella and her stepsisters are juxtaposed because Cinderella is kind and humble while the stepsisters are cruel and selfish. Putting them against each other makes those traits stand out more.","Name both sides of the contrast and explain what the comparison emphasizes."],
["Sources","Keep this short.","These are the sources I used to research imagery and the examples in my presentation.","You don't need a speech here unless your teacher asks about a source."],
["The End","Finish with a quick recap.","The main difference is that imagery helps us sense and experience something, while juxtaposition helps us compare things and notice differences. Thank you.","A final one-sentence comparison shows you understand both ideas."],
["AI Disclosure","Explain this only if needed.","My AI disclosure shows that I used ChatGPT for brainstorming, organizing, and understanding imagery and juxtaposition, and I included the AI log link.","Keep this consistent with the disclosure that is actually on your slide."]
];
const teacher=[
["What is imagery?","Descriptive language/details that appeal to the senses and help the audience imagine an experience."],
["Does imagery need all five senses?","No. It can use one or several senses."],
["Why is Ratatouille imagery?","Its food scenes use sensory details like color, sound, texture, aroma, and flavor to make food vivid."],
["What senses are in your soup example?","Smell, taste, and touch."],
["What is juxtaposition?","Putting two things close together so differences or similarities stand out."],
["Why is Cinderella juxtaposition?","Cinderella is contrasted with her stepsisters, making their different traits stand out."],
["Can something be both?","Yes. Sensory details can make two contrasting things vivid while juxtaposition emphasizes their difference."],
["What's the easiest difference?","Imagery = sense it. Juxtaposition = compare it."],
["Why do writers use imagery?","To make scenes vivid, create mood/emotion, help readers imagine, and make writing memorable."]
];
const classify=[
["The icy wind scratched my cheeks and made my fingers numb.","Imagery","Touch details help us feel the cold."],
["A silent library is shown beside a screaming concert crowd.","Juxtaposition","The two contrasting settings are presented against each other."],
["Sweet cinnamon filled the warm kitchen while cookies crunched between my teeth.","Imagery","Smell, touch, taste, and sound create a sensory experience."],
["A wealthy mansion is shown immediately after a tiny damaged apartment.","Juxtaposition","The contrast in living conditions is emphasized."],
["Two opposite settings are described with detailed sounds, smells, and textures.","Both","Sensory details create imagery while the two settings create juxtaposition."],
["A character walks into a room. No sensory detail or meaningful comparison is given.","Neither","There isn't enough sensory description or contrast for either technique."]
];
const rpo=[
["Ready Player One — Imagery","Wade's real-world surroundings / the Stacks","The descriptions of Wade's crowded, deteriorating physical environment help readers picture his setting.","It works as imagery because concrete physical details build a sensory picture of his real-world life."],
["Ready Player One — Juxtaposition","Real world vs. OASIS","Wade's difficult physical world is repeatedly placed against the expansive virtual OASIS.","It works as juxtaposition because the contrast emphasizes why the OASIS feels like an escape and offers possibilities his real life does not."]
];
let view="slides",si=0,ti=0,ci=0,score=0,locked=false,seconds=0,timer=null;
const names=[["slides","🎤 Slides"],["teacher","👩‍🏫 Teacher"],["mix","🔀 Examples"],["full","🎬 Full Run"],["rpo","📚 RPO"],["cram","🚨 Cram"]];
function tabs(){document.getElementById("tabs").innerHTML=names.map(x=>'<button class="tab '+(view===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join("")}
function go(v){view=v;tabs();render()}
function render(){let m=document.getElementById("main");if(view==="slides"){let x=slides[si];m.innerHTML='<div class="card"><div class="tag">Slide '+(si+1)+' / '+slides.length+'</div><div class="title">'+x[0]+'</div><div class="prompt">'+x[1]+'</div><div id="hint" class="box hidden">Hint: '+hintFor(si)+'</div><div id="ans" class="hidden"><div class="box say"><b>What you should hit:</b><br>'+x[2]+'</div><div class="box"><b>WHY:</b><br>'+x[3]+'</div></div><button class="btn" onclick="toggle(\'hint\')">🆘 Tiny hint</button><button class="btn" style="margin-top:8px" onclick="toggle(\'ans\')">Show what to say</button><div class="row"><button class="btn" onclick="si=Math.max(0,si-1);render()">← Back</button><button class="btn" onclick="si=Math.min(slides.length-1,si+1);render()">Next →</button></div></div>'}
else if(view==="teacher"){let x=teacher[ti];m.innerHTML='<div class="card"><div class="tag">Random teacher question</div><div class="prompt">'+x[0]+'</div><div id="ta" class="box hidden">'+x[1]+'</div><button class="btn" onclick="toggle(\'ta\')">Show answer</button><button class="btn" style="margin-top:8px" onclick="ti=Math.floor(Math.random()*teacher.length);render()">Another question</button></div>'}
else if(view==="mix"){let x=classify[ci];m.innerHTML='<div class="card"><div class="tag">Imagery / Juxtaposition / Both / Neither</div><div class="prompt">'+x[0]+'</div>'+["Imagery","Juxtaposition","Both","Neither"].map(z=>'<button class="choice" onclick="choose(this,\''+z+'\')">'+z+'</button>').join("")+'<div id="mixfb"></div></div>'}
else if(view==="full"){m.innerHTML='<div class="card"><div class="tag">Full presentation run</div><div class="title">Practice without stopping</div><p>Go through all 11 slides in order. Try to explain each slide before tapping Next.</p><div class="timer" id="tm">'+fmt(seconds)+'</div><button class="btn" onclick="runTimer()">'+(timer?'Stop timer':'Start timer')+'</button><button class="btn" style="margin-top:8px" onclick="view=\'slides\';si=0;tabs();render()">Start at Slide 1</button></div><div class="card"><b>Goal:</b> Do not memorize every word. Remember the idea you need to explain on each slide.</div>'}
else if(view==="rpo"){m.innerHTML=rpo.map(x=>'<div class="card"><div class="tag">'+x[0]+'</div><div class="title">'+x[1]+'</div><div class="box">'+x[2]+'</div><div class="box"><b>Why it works:</b> '+x[3]+'</div></div>').join("")}
else{m.innerHTML='<div class="card"><div class="tag">Right before you present</div><div class="anchor">IMAGERY = SENSE IT<br>JUXTAPOSITION = COMPARE IT</div></div><div class="card"><b>Imagery:</b> descriptive/sensory details → sight, sound, smell, taste, touch.</div><div class="card"><b>Ratatouille:</b> colorful food, sizzling, aroma, flavor, texture/warmth.</div><div class="card"><b>Why imagery:</b> mood • vivid scenes • emotion • imagination • memorable.</div><div class="card"><b>Juxtaposition:</b> two things close together → differences/similarities stand out.</div><div class="card"><b>Cinderella:</b> Cinderella ↔ stepsisters. Kind/humble ↔ cruel/selfish.</div><div class="card"><b>If you blank:</b> look at the picture and explain what it SHOWS and WHY that proves the technique.</div>'}}
function hintFor(i){return["Just name both topics.","Five senses.","Color + texture.","Go sense by sense.","Mood, vivid, emotion.","Steam, salty, warm.","Two things + contrast.","Cinderella vs. stepsisters.","Research sources.","Sense it vs. compare it.","Brainstorming, organizing, understanding."][i]}
function toggle(id){document.getElementById(id).classList.toggle("hidden")}
function choose(b,z){if(locked)return;locked=true;let x=classify[ci];document.querySelectorAll(".choice").forEach(e=>{if(e.textContent===x[1])e.classList.add("good")});if(z!==x[1])b.classList.add("bad");document.getElementById("mixfb").innerHTML='<div class="box"><b>'+x[1]+'</b><br>'+x[2]+'</div><button class="btn" onclick="ci=(ci+1)%classify.length;locked=false;render()">Next example →</button>'}
function fmt(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function runTimer(){if(timer){clearInterval(timer);timer=null}else{seconds=0;timer=setInterval(()=>{seconds++;let e=document.getElementById("tm");if(e)e.textContent=fmt(seconds)},1000)}render()}
tabs();render();
</script></body></html>
