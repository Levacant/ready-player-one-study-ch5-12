<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imagery & Juxtaposition Presentation Trainer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f7f8ff;font-family:system-ui,-apple-system,Arial}.app{max-width:760px;margin:auto;padding:14px 14px 70px}
h1{font-size:24px;margin:4px 0}.sub{color:#aeb8d5;font-size:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.btn,.tab,.choice{border:1px solid #34405f;background:#151d35;color:#fff;border-radius:14px;padding:13px;font-weight:750}.tab.on{background:#8bdcff;color:#06111d}.card{background:#151d35;border:1px solid #2d3857;border-radius:19px;padding:17px;margin:11px 0}.tag{font-size:11px;color:#8bdcff;text-transform:uppercase;font-weight:900;letter-spacing:.08em}.big{font-size:24px;font-weight:900;margin:7px 0}.q{font-size:19px;font-weight:800;line-height:1.35;margin:10px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0;font-size:16px}.choice.good{background:#12351f;border-color:#47d678}.choice.bad{background:#3a171d;border-color:#ff6b7b}.why{background:#0e162b;border-radius:13px;padding:12px;margin-top:10px;line-height:1.45}.say{border-left:4px solid #8bdcff;padding:10px 12px;background:#10192e;border-radius:8px;margin-top:10px}.small{color:#aeb8d5;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score{font-size:34px;font-weight:950}.hidden{display:none}.prompt{font-size:20px;font-weight:850;line-height:1.4}.anchor{font-size:22px;font-weight:950;text-align:center;padding:16px}.examples{line-height:1.5}
@media(max-width:520px){.tabs{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app">
<h1>Imagery + Juxtaposition</h1><div class="sub">Presentation trainer • test yourself + practice what to say</div>
<div class="tabs"><button class="tab on" onclick="mode('test',this)">Test</button><button class="tab" onclick="mode('speak',this)">Speaking</button><button class="tab" onclick="mode('final',this)">RPO Examples</button></div>
<div id="test"></div><div id="speak" class="hidden"></div><div id="final" class="hidden"></div>
</div><script>
const Q=[
{q:"Which best describes imagery?",o:["Putting opposites side by side","Language/details that appeal to the senses","Repeating a word","Giving objects human traits"],a:1,w:"Imagery helps an audience see, hear, smell, taste, or feel something.",s:"Imagery uses sensory details to help the audience experience a scene."},
{q:"Which list has all five senses used in imagery?",o:["Sight, sound, smell, taste, touch","Sight, mood, theme, sound, color","Taste, compare, smell, contrast, touch","Sound, character, plot, smell, sight"],a:0,w:"The five senses are sight, sound, smell, taste, and touch.",s:"When I explain imagery, I look for details connected to the five senses."},
{q:"Which sentence uses the strongest imagery?",o:["The soup was good.","I ate soup.","Hot steam brushed my face as the salty broth warmed my tongue.","There was soup on the table."],a:2,w:"Steam brushing the face and salty broth warming the tongue appeal to touch and taste.",s:"This is imagery because the sensory details help us feel and taste the scene."},
{q:"A movie shows butter sizzling loudly in a pan and steam rising. Why is that imagery?",o:["It compares two characters","It appeals to sound and sight and can make us imagine smell/taste","It explains the plot","It uses opposites"],a:1,w:"Sizzling = sound; steam/visual detail = sight, and together they can suggest other food senses.",s:"The scene uses sensory details, so the audience can almost imagine experiencing the food."},
{q:"Why is Ratatouille a strong imagery example?",o:["It has a rat as the main character","Food scenes use color, sound, texture, close-ups, and reactions","It compares rich and poor people","Every scene has dialogue"],a:1,w:"Its food scenes are built around sensory experience.",s:"Ratatouille uses close-ups, sounds, textures, colors, and reactions to make the food feel vivid."},
{q:"What is juxtaposition?",o:["Describing all five senses","Putting two things near each other so differences or similarities stand out","Explaining a symbol","Making a scene realistic"],a:1,w:"Juxtaposition depends on comparison created by placement or presentation.",s:"Juxtaposition puts two things close together so their differences or similarities become clearer."},
{q:"Which is the clearest example of juxtaposition?",o:["A cold wind stings someone's face","A quiet library beside a loud concert scene","A character eats dinner","A narrator describes a blue sky"],a:1,w:"Quiet versus loud becomes more noticeable when the scenes are placed against each other.",s:"The contrast makes each side stand out more."},
{q:"Why does Cinderella work as juxtaposition?",o:["The movie contains colorful animation","Cinderella's kindness/humility contrasts with the stepsisters' cruelty/selfishness","Food is described with sensory detail","The characters live in one house"],a:1,w:"The important part is the contrast between the characters, not simply that they are different.",s:"Cinderella is kind and humble, while the stepsisters are cruel and selfish. The contrast makes those traits stand out."},
{q:"Which Cinderella contrast is ALSO a juxtaposition example?",o:["Her servant/poor life versus the glamorous royal-ball life","The sound of her footsteps","The color of a dress by itself","A close-up of food"],a:0,w:"Her ordinary servant life placed against the elegant ball life creates a strong contrast.",s:"The movie contrasts Cinderella's servant life with the glamorous royal ball, making the difference feel stronger."},
{q:"What is the easiest way to remember the difference?",o:["Imagery = compare; juxtaposition = sense","Imagery = sense; juxtaposition = compare","Both only mean description","Both only mean opposites"],a:1,w:"Imagery creates a sensory experience; juxtaposition creates a comparison.",s:"Imagery is 'sense it.' Juxtaposition is 'compare it.'"},
{q:"Why do creators use imagery?",o:["To make scenes vivid and create mood/emotion","Only to make writing longer","Only to describe colors","To hide the main idea"],a:0,w:"Sensory detail can make an audience feel more present in a scene.",s:"Imagery makes scenes vivid and can create mood and emotion."},
{q:"Why do creators use juxtaposition?",o:["To list the five senses","To make a contrast or similarity easier to notice","To describe smells","To avoid characterization"],a:1,w:"Putting things against one another can emphasize what makes each one different or similar.",s:"Juxtaposition emphasizes contrast so an idea or character trait stands out more."},
{q:"A peaceful neighborhood is shown immediately beside a ruined, dangerous area. What technique is MOST obvious?",o:["Imagery only","Juxtaposition","Rhyme","Alliteration"],a:1,w:"The meaning comes from the contrast between the two settings.",s:"This is juxtaposition because placing the settings against each other makes their differences stand out."},
{q:"A paragraph describes rusty metal, choking smoke, bitter air, and rough concrete. What technique is MOST obvious?",o:["Juxtaposition","Imagery","Foreshadowing only","Irony"],a:1,w:"Those details appeal to sight, smell/taste, and touch.",s:"This is imagery because the description appeals to multiple senses."},
{q:"Can one scene contain BOTH imagery and juxtaposition?",o:["No, never","Yes—sensory details can describe two contrasting things","Only in poetry","Only if there is dialogue"],a:1,w:"The techniques do different jobs, so they can appear together.",s:"Yes. Imagery can make each side vivid while juxtaposition makes the contrast between them stand out."}
];
let qi=0,score=0,locked=false;
function mode(id,b){['test','speak','final'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function render(){let x=Q[qi];document.getElementById('test').innerHTML='<div class="card"><div class="tag">Question '+(qi+1)+' / '+Q.length+'</div><div class="q">'+x.q+'</div>'+x.o.map((z,i)=>'<button class="choice" onclick="pick('+i+',this)">'+z+'</button>').join('')+'<div id="fb"></div></div>'}
function pick(i,b){if(locked)return;locked=true;let x=Q[qi],bs=[...document.querySelectorAll('.choice')];bs[x.a].classList.add('good');if(i===x.a)score++;else b.classList.add('bad');document.getElementById('fb').innerHTML='<div class="why"><b>WHY:</b> '+x.w+'<div class="say"><b>What you could say:</b><br>'+x.s+'</div></div><button class="btn" style="width:100%;margin-top:10px" onclick="nextQ()">Next →</button>'}
function nextQ(){qi++;locked=false;if(qi>=Q.length){document.getElementById('test').innerHTML='<div class="card"><div class="tag">Finished</div><div class="score">'+score+'/'+Q.length+'</div><p>'+(score>=13?'You\'re in strong shape. Now practice Speaking mode out loud.':score>=10?'Good. Review the WHY boxes, then run it again.':'Run it again and focus on why each answer works.')+'</p><button class="btn" onclick="qi=0;score=0;render()">Retake</button></div>';return}render()}
const S=[
["What is imagery?","Imagery uses sensory details that help the audience see, hear, smell, taste, or feel a scene."],
["What are the five senses?","Sight, sound, smell, taste, and touch."],
["Why Ratatouille?","Its food scenes use close-ups, sounds, textures, colors, steam, and reactions so we imagine experiencing the food."],
["Why do creators use imagery?","To make a scene vivid and help create mood and emotion."],
["What is juxtaposition?","Putting two things close together so their differences or similarities stand out."],
["Why Cinderella?","Cinderella's kindness and humility contrast with the stepsisters' cruelty and selfishness."],
["Another Cinderella contrast?","Her servant life versus the glamorous royal-ball life."],
["Big difference?","Imagery = sense it. Juxtaposition = compare it."],
["Can both be used together?","Yes. Imagery makes each side vivid; juxtaposition emphasizes the contrast."]
];let si=0;
function speak(){let x=S[si];document.getElementById('speak').innerHTML='<div class="card"><div class="tag">Say it out loud first</div><div class="prompt">'+x[0]+'</div><div id="sa" class="hidden say">'+x[1]+'</div><button class="btn" style="width:100%;margin-top:12px" onclick="document.getElementById(\'sa\').classList.remove(\'hidden\')">Show what I should hit</button><div class="row"><button class="btn" onclick="si=(si-1+S.length)%S.length;speak()">← Back</button><button class="btn" onclick="si=(si+1)%S.length;speak()">Next →</button></div></div>'}
speak();
document.getElementById('final').innerHTML=`
<div class="card"><div class="tag">Ready Player One — imagery</div><div class="big">The Stacks / Wade's environment</div>
<div class="examples">The novel's descriptions of Wade's crowded, deteriorating real-world surroundings use concrete visual and physical details to help the reader picture what his life is like.</div>
<div class="why"><b>WHY IT WORKS:</b> the description builds a sensory picture of the setting instead of only telling us that Wade lives in poverty.</div>
<div class="say"><b>Say:</b> “In <i>Ready Player One</i>, the descriptions of Wade's real-world environment are an example of imagery because the physical details help us picture and experience his setting.”</div></div>
<div class="card"><div class="tag">Ready Player One — juxtaposition</div><div class="big">Real world vs. the OASIS</div>
<div class="examples">Wade's difficult physical world is repeatedly placed against the much more expansive virtual OASIS, where he attends school and can escape parts of his real life.</div>
<div class="why"><b>WHY IT WORKS:</b> placing those two worlds against each other emphasizes the difference between Wade's limited real life and the possibilities he experiences virtually.</div>
<div class="say"><b>Say:</b> “The real world and the OASIS are juxtaposed because their contrast makes Wade's reasons for escaping into the OASIS stand out.”</div></div>
<div class="card"><div class="anchor">IMAGERY = SENSE IT<br>JUXTAPOSITION = COMPARE IT</div></div>`;
render();
</script></body></html>
